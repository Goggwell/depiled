[package]
name = "depiled"
version = "0.2.0"
edition = "2024"
description = "Organize Steam library collections by rules, with snapshots and undo"
license = "MIT"
repository = "https://github.com/Goggwell/depiled"

[workspace]
members = ["ui/src-tauri"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sysinfo = { version = "0.40.0", default-features = false, features = ["system"] }
toml = "1.1.8"
rusty-leveldb = { version = "4.0.2", default-features = false, features = ["fs"] }
ureq = { version = "3.5.0", features = ["json"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true