name: Nightly

# Every push to main builds installers for everyone who wants the newest version. They go to
# a single "nightly" pre-release that is replaced each time, and each run's installers are
# also kept as workflow artifacts for 30 days, so earlier builds stay downloadable.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - name: Replace the nightly pre-release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh release delete nightly --repo "$REPO" --cleanup-tag --yes || true
          short=$(echo "$GITHUB_SHA" | cut -c1-7)
          gh release create nightly --repo "$REPO" --target "$GITHUB_SHA" --prerelease \
            --title "Nightly ($short)" \
            --notes "Built from $GITHUB_SHA on $(date -u +%Y-%m-%d). The newest changes, tested less than a numbered release. Earlier nightly builds are kept for 30 days under the Actions tab."
          echo "id=$(gh release view nightly --repo "$REPO" --json databaseId --jq .databaseId)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: windows-latest
            target: i686-pc-windows-msvc
            bundles: nsis
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ui
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v5
        with:
          name: depiled-${{ matrix.target }}-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
