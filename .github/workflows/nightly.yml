name: Nightly

# Every push to main builds installers for everyone who wants the newest version. They go to
# a single "nightly" pre-release that is replaced each time, and each run's installers are
# also kept as workflow artifacts for 30 days, so earlier builds stay downloadable.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - name: Replace the nightly pre-release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh release delete nightly --repo "$REPO" --cleanup-tag --yes || true
          short=$(echo "$GITHUB_SHA" | cut -c1-7)
          gh release create nightly --repo "$REPO" --target "$GITHUB_SHA" --prerelease \
            --title "Nightly ($short)" \
            --notes "Built from $GITHUB_SHA on $(date -u +%Y-%m-%d). The newest changes, tested less than a numbered release. Earlier nightly builds are kept for 30 days under the Actions tab."
          echo "id=$(gh release view nightly --repo "$REPO" --json databaseId --jq .databaseId)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: windows-latest
            target: i686-pc-windows-msvc
            bundles: nsis
          # macOS builds are paused until they can be tested on a Mac. The code still supports
          # macOS (and CI still tests on it); to build installers again, put these back:
          # - os: macos-latest
          #   target: aarch64-apple-darwin
          #   bundles: app,dmg
          # - os: macos-latest
          #   target: x86_64-apple-darwin
          #   bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      # Nightly builds are numbered after the next release (0.2.0 builds as 0.2.1-nightly.57),
      # so the app can tell one build from the next and offer the newer one.
      - name: Number the build
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const p = "ui/src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(p, "utf8"));
            const [major, minor, patch] = c.version.split("-")[0].split(".").map(Number);
            c.version = `${major}.${minor}.${patch + 1}-nightly.${process.env.RUN}`;
            fs.writeFileSync(p, JSON.stringify(c, null, 2));
            console.log(c.version);
          '
        env:
          RUN: ${{ github.run_number }}
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update files, so the app only installs updates built here.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Where the app sends bug reports and feedback. Kept as a secret so the address (and
          # the inbox behind it) isn't in the public code; builds without it offer to copy a
          # report instead.
          DEPILED_FEEDBACK_URL: ${{ secrets.FEEDBACK_URL }}
        with:
          projectPath: ui
          releaseId: ${{ needs.prepare.outputs.release_id }}
          # The update files are only made here, where the signing key is. A build without the
          # key (anyone building from source) makes the installers alone.
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.updates.conf.json
      - uses: actions/upload-artifact@v5
        with:
          name: depiled-${{ matrix.target }}-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
