name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: windows-latest
            target: i686-pc-windows-msvc
            bundles: nsis
          # macOS builds are paused until they can be tested on a Mac. The code still supports
          # macOS (and CI still tests on it); to build installers again, put these back:
          # - os: macos-latest
          #   target: aarch64-apple-darwin
          #   bundles: app,dmg
          # - os: macos-latest
          #   target: x86_64-apple-darwin
          #   bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update files, so the app only installs updates built here.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Where the app sends bug reports and feedback. Kept as a secret so the address (and
          # the inbox behind it) isn't in the public code; builds without it offer to copy a
          # report instead.
          DEPILED_FEEDBACK_URL: ${{ secrets.FEEDBACK_URL }}
        with:
          projectPath: ui
          tagName: ${{ github.ref_name }}
          releaseName: Depiled ${{ github.ref_name }}
          releaseDraft: true
          # The update files are only made here, where the signing key is. A build without the
          # key (anyone building from source) makes the installers alone.
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.updates.conf.json