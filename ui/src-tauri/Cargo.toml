[package]
name = "depiled-app"
version = "0.2.2"
description = "Organize your Steam library collections, with undo"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/Goggwell/depiled"

[lib]
name = "depiled_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
depiled = { path = "../.." }
tauri = { version = "2.12.5", features = ["protocol-asset"] }
tauri-plugin-updater = "2.14.1"
serde_json = "1"
